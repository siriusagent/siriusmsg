[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "siriusmsg-sdk"
version = "1.0.0"
description = "Generated models and asyncio client for the SiriusMsg local service protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator==0.28.5",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.8"
]

[tool.hatch.build.targets.wheel]
packages = ["src/siriusmsg_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
